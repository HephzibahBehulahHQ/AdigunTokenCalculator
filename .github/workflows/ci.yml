name: Build and test
on:
  push:
    branches:
      - main
      - codex/milestone-4-completion
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and generate lockfile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Commit lockfile to the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/milestone-4-completion'
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "build: lock npm dependency tree"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - run: npm test
      - run: npm run build
