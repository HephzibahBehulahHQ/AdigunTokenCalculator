name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build project-site bundle
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages deployment source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.info(`GitHub Pages build type: ${data.build_type || "legacy"}`);
            if (data.build_type !== "workflow") {
              throw new Error(
                "GitHub Pages is still configured for branch-based publishing. In Repository Settings > Pages > Build and deployment, change Source to GitHub Actions. This Vite app must deploy the compiled dist artifact; the automatic Jekyll deployment can overwrite it."
              );
            }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
