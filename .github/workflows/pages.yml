name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Match CI's supported OS for the pinned Playwright/Chromium toolchain.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for required browser verification
        run: npx playwright-core install --with-deps chromium
      - name: Require the browser test executable
        run: node --input-type=module -e 'import {chromium} from "playwright-core"; import {accessSync} from "node:fs"; accessSync(chromium.executablePath());'
      - name: Run all unit and browser tests before publication
        run: npm test
      - name: Build project-site bundle
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages deployment source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.info(`GitHub Pages build type: ${data.build_type || "legacy"}`);
            if (data.build_type !== "workflow") {
              throw new Error(
                "GitHub Pages is still configured for branch-based publishing. In Repository Settings > Pages > Build and deployment, change Source to GitHub Actions. This Vite app must deploy the compiled dist artifact; the automatic Jekyll deployment can overwrite it."
              );
            }
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    name: Verify published artifact and calculator workflows
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for live verification
        run: npx playwright-core install --with-deps chromium
      - name: Download the exact artifact published by this run
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-verification
      - name: Extract the published site
        run: |
          mkdir -p .pages-verification/site
          tar -xf .pages-verification/artifact.tar -C .pages-verification/site
      - name: Verify live bytes, tool workflows, localization and browser errors
        env:
          DEPLOYED_SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-deployment.mjs --url "$DEPLOYED_SITE_URL" --artifact .pages-verification/site
